name: Build and Push

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY || 'docker.io' }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend_deploy
          file: ./backend_deploy/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/$GITHUB_REPOSITORY:backend-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/$GITHUB_REPOSITORY:frontend-${{ github.sha }}
